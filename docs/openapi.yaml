openapi: 3.1.0
info:
  title: Travel Expenses Tracker API
  version: 1.0.0
  description:
    'Public shared ledger. No login, API key, or authorization. Anyone who reaches this API can read
    or mutate all ledger data. Responses use Cache-Control: no-store. All money/rates are strings. Purchases
    retain saved rates. Timezone: Asia/Tokyo. JSON mutations require application/json and reject an explicitly
    foreign Origin; callers without Origin are supported. Bodies limited to 16 KiB. Error codes include
    VALIDATION_ERROR, MALFORMED_JSON, BODY_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, FOREIGN_ORIGIN, NOT_FOUND,
    VERSION_CONFLICT, NAME_CONFLICT, IDEMPOTENCY_CONFLICT, PURCHASE_DELETED, PURCHASE_ACTIVE,
    PURCHASER_UNAVAILABLE, RATE_NOT_CONFIGURED, DATABASE_UNAVAILABLE, INTERNAL_ERROR. No application/platform
    rate limiter is configured by default.'
servers:
  - url: /api/v1
security: []
paths:
  /health:
    get:
      summary: Liveness without database access
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - status
                    properties:
                      status:
                        const: ok
        '400': &a1
          description: Malformed JSON, query, cursor, or validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &a2
          description: Explicitly foreign browser Origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': &a3
          description: Unknown resource or route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': &a4
          description: Version, state, name, or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413': &a5
          description: Body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415': &a6
          description: Content type must be application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': &a7
          description: A configured platform rate limit was reached (none configured by default)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': &a8
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': &a9
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /settings:
    get:
      summary: Get the singleton settings
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Settings'
        '400': *a1
        '403': *a2
        '404': *a3
        '409': *a4
        '413': *a5
        '415': *a6
        '429': *a7
        '500': *a8
        '503': *a9
    patch:
      summary: Set the default rate for future purchases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Settings'
        '400': *a1
        '403': *a2
        '404': *a3
        '409': *a4
        '413': *a5
        '415': *a6
        '429': *a7
        '500': *a8
        '503': *a9
  /purchasers:
    get:
      summary: List active or all purchasers
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Purchaser'
        '400': *a1
        '403': *a2
        '404': *a3
        '409': *a4
        '413': *a5
        '415': *a6
        '429': *a7
        '500': *a8
        '503': *a9
    post:
      summary: Create a purchaser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaserCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Purchaser'
        '400': *a1
        '403': *a2
        '404': *a3
        '409': *a4
        '413': *a5
        '415': *a6
        '429': *a7
        '500': *a8
        '503': *a9
  /purchasers/{id}:
    parameters:
      - &a11
        name: id
        in: path
        required: true
        schema: &a10
          type: string
          format: uuid
    patch:
      summary: Rename, archive, or reactivate a purchaser
      description:
        Name uniqueness is case-insensitive across active and archived purchasers. Historical purchases
        display the current name. Archiving is atomic with new purchase/reassignment active checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaserPatch'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Purchaser'
        '400': *a1
        '403': *a2
        '404': *a3
        '409': *a4
        '413': *a5
        '415': *a6
        '429': *a7
        '500': *a8
        '503': *a9
  /purchases:
    get:
      summary: Filter and paginate purchases
      description:
        Descending (purchasedAt,id) keyset. Cursor includes filters and cannot be reused with different
        filters. Pagination is not a frozen snapshot under concurrent editing.
      parameters:
        - &a12
          name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Inclusive Tokyo calendar date
        - &a13
          name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Inclusive Tokyo calendar date; next midnight excluded
        - &a14
          name: purchaserId
          in: query
          required: false
          schema: *a10
        - &a15
          name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description:
            Trimmed literal case-insensitive substring in purchase name, description, or saved location text.
            LIKE wildcards have no special meaning. The same filter applies to list and summary.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - deleted
            default: active
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
          description: Opaque cursor from page.nextCursor
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseList'
        '400': *a1
        '403': *a2
        '404': *a3
        '409': *a4
        '413': *a5
        '415': *a6
        '429': *a7
        '500': *a8
        '503': *a9
    post:
      summary: Create or safely replay a purchase
      description:
        'Create with only name and price (positive whole yen, as a number or string). Optional purchaser
        is an existing active name, matched case-insensitively; defaults to Me. The saved default exchange
        rate and insertion time apply when omitted. Optional id supports retry safety: same UUID and canonical
        input returns the current active resource with 200 without resolving defaults again; changed input
        conflicts, and deleted purchases are never restored by replay. With no id each POST creates a new
        purchase. Derived amounts are calculated by the server, round-half-up.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseCreate'
            examples:
              minimal:
                value:
                  name: Lunch
                  price: 1500
              place:
                value:
                  name: Temple admission
                  price: 600
                  location: 浅草寺, Tokyo
              gps:
                value:
                  name: Tokyo Tower
                  price: 1500
                  gps:
                    lat: 35.6586
                    lng: 139.7454
              maps:
                value:
                  name: Coffee
                  price: 500
                  location: https://www.google.com/maps?q=35.6812,139.7671
              labeledGps:
                value:
                  name: Tokyo Tower admission
                  price: 1500
                  location: Tokyo Tower
                  gps:
                    lat: 35.6586
                    lng: 139.7454
      responses:
        '200':
          description: Successful replay
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Purchase'
        '201':
          description: New purchase
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Purchase'
        '400': *a1
        '403': *a2
        '404': *a3
        '409': *a4
        '413': *a5
        '415': *a6
        '429': *a7
        '500': *a8
        '503': *a9
  /purchases/{id}:
    parameters:
      - *a11
    get:
      summary: Get active or soft-deleted purchase detail
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Purchase'
        '400': *a1
        '403': *a2
        '404': *a3
        '409': *a4
        '413': *a5
        '415': *a6
        '429': *a7
        '500': *a8
        '503': *a9
    patch:
      summary: Edit an active purchase using its version
      description:
        Stale version returns VERSION_CONFLICT. Text-only edits retain monetary values. Reassignment
        requires an active purchaser; leaving an existing archived purchaser unchanged is allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchasePatch'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Purchase'
        '400': *a1
        '403': *a2
        '404': *a3
        '409': *a4
        '413': *a5
        '415': *a6
        '429': *a7
        '500': *a8
        '503': *a9
    delete:
      summary: Move an active purchase to Trash
      parameters:
        - name: version
          in: query
          required: true
          schema: &a16
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        '204':
          description: Soft deleted; empty body
        '400': *a1
        '403': *a2
        '404': *a3
        '409': *a4
        '413': *a5
        '415': *a6
        '429': *a7
        '500': *a8
        '503': *a9
  /purchases/{id}/restore:
    parameters:
      - *a11
    post:
      summary: Restore a purchase from Trash
      description:
        Restores original saved values. An archived purchaser is permitted. Stale version returns
        VERSION_CONFLICT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Version'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Purchase'
        '400': *a1
        '403': *a2
        '404': *a3
        '409': *a4
        '413': *a5
        '415': *a6
        '429': *a7
        '500': *a8
        '503': *a9
  /summary:
    get:
      summary: Totals and Tokyo day/purchaser series across all matching active rows
      description:
        Uses one consistent SQL statement. Summation uses persisted rounded amounts across all pages.
        Deleted status and pagination parameters are not accepted. Empty results return count 0, zero string
        totals and empty arrays.
      parameters:
        - *a12
        - *a13
        - *a14
        - *a15
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Summary'
        '400': *a1
        '403': *a2
        '404': *a3
        '409': *a4
        '413': *a5
        '415': *a6
        '429': *a7
        '500': *a8
        '503': *a9
components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
            message:
              type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
            requestId: *a10
    Settings:
      type: object
      additionalProperties: false
      required:
        - defaultThbPerJpy
        - version
        - updatedAt
        - timezone
      properties:
        defaultThbPerJpy:
          type:
            - string
            - 'null'
        version: *a16
        updatedAt: &a17
          type: string
          format: date-time
        timezone:
          const: Asia/Tokyo
    SettingsPatch:
      type: object
      additionalProperties: false
      required:
        - defaultThbPerJpy
        - version
      properties:
        defaultThbPerJpy: &a18
          type: string
          pattern: ^\d+(\.\d{1,8})?$
          description: THB for one JPY, greater than zero and at most 100. No market rate is invented.
        version: *a16
    Purchaser:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - archived
        - archivedAt
        - version
        - createdAt
        - updatedAt
      properties:
        id: *a10
        name:
          type: string
          minLength: 1
          maxLength: 60
        archived:
          type: boolean
        archivedAt:
          type:
            - string
            - 'null'
          format: date-time
        version: *a16
        createdAt: *a17
        updatedAt: *a17
    PurchaserCreate:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
    PurchaserPatch:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        archived:
          type: boolean
        version: *a16
      anyOf:
        - required:
            - name
        - required:
            - archived
    PurchaseCreate:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        id: *a10
        name: &a19
          type: string
          minLength: 1
          maxLength: 160
        originalAmount: &a20
          type: string
          pattern: ^\d+(\.\d{1,2})?$
          description: Positive decimal, at most 999999999.99. JPY must use integer syntax.
        originalCurrency: &a21
          type: string
          enum:
            - JPY
            - THB
        purchaserId: *a10
        description: &a22
          type: string
          maxLength: 4000
          default: ''
        purchasedAt: &a23
          type: string
          format: date-time
          description:
            Explicit Z or offset required; omitted on creation means insertion time. Calendar dates must be
            valid.
        exchangeRate: *a18
        price:
          description:
            Price in Japanese yen. Positive whole-yen number or decimal-free string; at most 999999999.
            Supply price or originalAmount, not both.
          oneOf:
            - type: integer
              minimum: 1
              maximum: 999999999
            - type: string
              maxLength: 32
              pattern: ^\d+$
        purchaser:
          type: string
          minLength: 1
          maxLength: 60
          default: Me
          description:
            Existing active purchaser name, trimmed and matched case-insensitively, for example Me, me, A, or
            a. Supply purchaser or purchaserId, not both. Defaults to Me if neither is supplied; unknown or
            archived names return 409 PURCHASER_UNAVAILABLE.
        location:
          $ref: '#/components/schemas/LocationInput'
        gps:
          $ref: '#/components/schemas/LocationInput'
          description:
            Alias for location/GPS input. A place label in location can be combined with GPS or paired
            top-level coordinates. Multiple coordinate sources must agree after normalization; conflicting
            labels/coordinates or null/empty clearing combined with nonempty data are rejected.
        latitude:
          oneOf:
            - type: number
              minimum: -90
              maximum: 90
            - type: string
              pattern: ^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$
          description: Finite decimal between -90 and 90; normalized to seven decimal places.
        lat:
          oneOf:
            - type: number
              minimum: -90
              maximum: 90
            - type: string
              pattern: ^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$
          description: Finite decimal between -90 and 90; normalized to seven decimal places.
        longitude:
          oneOf:
            - type: number
              minimum: -180
              maximum: 180
            - type: string
              pattern: ^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$
          description: Finite decimal between -180 and 180; normalized to seven decimal places.
        lng:
          oneOf:
            - type: number
              minimum: -180
              maximum: 180
            - type: string
              pattern: ^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$
          description: Finite decimal between -180 and 180; normalized to seven decimal places.
        lon:
          oneOf:
            - type: number
              minimum: -180
              maximum: 180
            - type: string
              pattern: ^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$
          description: Finite decimal between -180 and 180; normalized to seven decimal places.
      description:
        The minimal request is {"name":"Lunch","price":1500}. Currency defaults to JPY, purchaser to Me
        (case-insensitive name lookup), description to empty, and time to insertion time. id is generated if
        omitted; send a stable UUID for retry safety, since each id-free POST is a new purchase. The existing
        originalAmount/originalCurrency/purchaserId format remains supported, including THB. An explicit
        exchangeRate overrides the saved default; missing both returns 409 RATE_NOT_CONFIGURED.
        Unknown/derived fields, nulls, conflicting amount fields, and conflicting purchaser selectors are
        rejected. Optional location/gps or paired top-level latitude/longitude (lat/lng/lon aliases) are
        normalized into location. A location label may be combined with GPS or top-level coordinates and is
        retained with the coordinate pair. Repeated coordinate sources must agree after normalization;
        distinct labels, conflicting coordinates, or null/empty clearing combined with nonempty data are
        rejected. Retry identity includes the normalized location. Omitted/null locations preserve legacy
        creation identities; equivalent GPS representations replay safely with the same UUID.
      oneOf:
        - required:
            - price
          not:
            required:
              - originalAmount
        - required:
            - originalAmount
          not:
            required:
              - price
      allOf:
        - not:
            required:
              - purchaser
              - purchaserId
        - if:
            required:
              - price
          then:
            properties:
              originalCurrency:
                const: JPY
    PurchasePatch:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        name: *a19
        originalAmount: *a20
        originalCurrency: *a21
        purchaserId: *a10
        description: *a22
        purchasedAt: *a23
        exchangeRate: *a18
        version: *a16
        location:
          $ref: '#/components/schemas/LocationInput'
        gps:
          $ref: '#/components/schemas/LocationInput'
          description:
            Alias for location/GPS input. A place label in location can be combined with GPS or paired
            top-level coordinates. Multiple coordinate sources must agree after normalization; conflicting
            labels/coordinates or null/empty clearing combined with nonempty data are rejected.
        latitude:
          oneOf:
            - type: number
              minimum: -90
              maximum: 90
            - type: string
              pattern: ^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$
          description: Finite decimal between -90 and 90; normalized to seven decimal places.
        lat:
          oneOf:
            - type: number
              minimum: -90
              maximum: 90
            - type: string
              pattern: ^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$
          description: Finite decimal between -90 and 90; normalized to seven decimal places.
        longitude:
          oneOf:
            - type: number
              minimum: -180
              maximum: 180
            - type: string
              pattern: ^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$
          description: Finite decimal between -180 and 180; normalized to seven decimal places.
        lng:
          oneOf:
            - type: number
              minimum: -180
              maximum: 180
            - type: string
              pattern: ^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$
          description: Finite decimal between -180 and 180; normalized to seven decimal places.
        lon:
          oneOf:
            - type: number
              minimum: -180
              maximum: 180
            - type: string
              pattern: ^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$
          description: Finite decimal between -180 and 180; normalized to seven decimal places.
      minProperties: 2
      dependentRequired:
        originalCurrency:
          - originalAmount
      description:
        Omitted fields retain saved values. Existing rate retained unless exchangeRate supplied. Require
        at least one editable field. JPY precision validated against merged currency. Optional location/gps or
        paired top-level latitude/longitude (lat/lng/lon aliases) are normalized into location. A location
        label may be combined with GPS or top-level coordinates and is retained with the coordinate pair.
        Repeated coordinate sources must agree after normalization; distinct labels, conflicting coordinates,
        or null/empty clearing combined with nonempty data are rejected. Omitted location retains the saved
        value; explicit null/empty clears it. Location-only edits require the current version and do not
        affect money or exchange-rate snapshots.
    Purchase:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - originalAmount
        - originalCurrency
        - purchaserId
        - description
        - purchasedAt
        - exchangeRate
        - rateSource
        - amountJpy
        - amountThb
        - purchaser
        - createdAt
        - updatedAt
        - deletedAt
        - version
        - location
      properties:
        id: *a10
        name: *a19
        originalAmount: *a20
        originalCurrency: *a21
        purchaserId: *a10
        description:
          type: string
        purchasedAt: *a23
        exchangeRate:
          type: string
        rateSource:
          enum:
            - default
            - manual
        amountJpy:
          type: string
        amountThb:
          type: string
        purchaser:
          type: object
          additionalProperties: false
          required:
            - id
            - name
            - archived
          properties:
            id: *a10
            name:
              type: string
            archived:
              type: boolean
        createdAt: *a17
        updatedAt: *a17
        deletedAt:
          type:
            - string
            - 'null'
          format: date-time
        version: *a16
        location:
          oneOf:
            - $ref: '#/components/schemas/PurchaseLocation'
            - type: 'null'
    Totals:
      type: object
      additionalProperties: false
      required:
        - jpy
        - thb
      properties:
        jpy:
          type: string
        thb:
          type: string
    Summary:
      type: object
      additionalProperties: false
      required:
        - timezone
        - count
        - totals
        - byDay
        - byPurchaser
      properties:
        timezone:
          const: Asia/Tokyo
        count:
          type: integer
          minimum: 0
        totals:
          $ref: '#/components/schemas/Totals'
        byDay:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - date
              - count
              - jpy
              - thb
            properties:
              date:
                type: string
                format: date
              count:
                type: integer
              jpy:
                type: string
              thb:
                type: string
        byPurchaser:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - purchaserId
              - name
              - count
              - jpy
              - thb
            properties:
              purchaserId: *a10
              name:
                type: string
              count:
                type: integer
              jpy:
                type: string
              thb:
                type: string
    Version:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version: *a16
    PurchaseList:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Purchase'
        page:
          type: object
          additionalProperties: false
          required:
            - nextCursor
          properties:
            nextCursor:
              type:
                - string
                - 'null'
    PurchaseLocation:
      type: object
      additionalProperties: false
      required:
        - text
        - latitude
        - longitude
        - googleMapsUrl
      properties:
        text:
          type:
            - string
            - 'null'
          maxLength: 2000
        latitude:
          type:
            - number
            - 'null'
          minimum: -90
          maximum: 90
        longitude:
          type:
            - number
            - 'null'
          minimum: -180
          maximum: 180
        googleMapsUrl:
          type: string
          format: uri
          maxLength: 2048
          description:
            Safe Google Maps search link generated from the normalized coordinate pair/place text. Trusted
            Google Maps shortlinks may be retained without network resolution.
      description:
        Normalized optional purchase location. Latitude and longitude are either both numbers or both
        null. No external geocoding or link resolution is performed.
    LocationInput:
      description:
        'Optional location in a common pasted format: place/address text, latitude/longitude pair,
        labeled decimal coordinates, degrees/minutes/seconds, geo: URI, WKT POINT, Google/Apple/OpenStreetMap
        link, JSON coordinate array, coordinate object, GeoJSON Point/Feature, or browser geolocation coords.
        Plain pairs/arrays use latitude,longitude; WKT/GeoJSON use longitude,latitude. A clearly reversed
        plain pair is corrected when only one ordering is valid. Place text max 2000 characters; generated
        Maps URL max 2048 encoded characters. Invalid/incomplete/out-of-range numeric data is rejected.
        Supplied googleMapsUrl is never trusted. null or empty input means no location.'
      oneOf:
        - type: 'null'
        - type: string
          maxLength: 2000
        - type: array
          minItems: 2
          maxItems: 2
          items:
            oneOf:
              - type: number
              - type: string
        - type: object
          additionalProperties: true
          properties:
            text:
              type:
                - string
                - 'null'
              maxLength: 2000
            label:
              type: string
              maxLength: 2000
            address:
              type: string
              maxLength: 2000
            place:
              type: string
              maxLength: 2000
            latitude:
              oneOf:
                - type: number
                  minimum: -90
                  maximum: 90
                - type: string
                  pattern: ^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$
              description: Finite decimal between -90 and 90; normalized to seven decimal places.
            longitude:
              oneOf:
                - type: number
                  minimum: -180
                  maximum: 180
                - type: string
                  pattern: ^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$
              description: Finite decimal between -180 and 180; normalized to seven decimal places.
            lat:
              oneOf:
                - type: number
                  minimum: -90
                  maximum: 90
                - type: string
                  pattern: ^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$
              description: Finite decimal between -90 and 90; normalized to seven decimal places.
            lng:
              oneOf:
                - type: number
                  minimum: -180
                  maximum: 180
                - type: string
                  pattern: ^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$
              description: Finite decimal between -180 and 180; normalized to seven decimal places.
            lon:
              oneOf:
                - type: number
                  minimum: -180
                  maximum: 180
                - type: string
                  pattern: ^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$
              description: Finite decimal between -180 and 180; normalized to seven decimal places.
            type:
              type: string
              enum:
                - Point
                - Feature
            coordinates:
              type: array
              minItems: 2
              maxItems: 3
              items:
                type: number
            coords:
              type: object
            geometry:
              type: object
            googleMapsUrl:
              type: string
              description: Ignored; the safe link is derived from validated content.
